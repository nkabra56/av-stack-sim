[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-park"
version = "0.1.0"
description = "Autonomous parking planning & control simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# DESIGN.md section 10's "learned parking policy" extension -- kept out of core deps
# since torch (via stable-baselines3) is a multi-GB addition. Only core/rl/ needs this.
rl = ["gymnasium", "stable-baselines3"]
# Optional 3D export (foxglove_export.py), additive to the default Matplotlib animation.
# Only core/demo.py's --foxglove flag needs this.
viz = ["foxglove-sdk"]

[tool.setuptools.packages.find]
include = ["core*"]
